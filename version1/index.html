<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Agreement Studio — Exact Legal Document Generator</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<style>
  :root{
    --bg:#f1f5f9; --panel:#ffffff; --border:#cbd5e1; --primary:#0f172a; --text:#0f172a;
  }
  *{box-sizing:border-box;}
  body{
    margin:0; font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,sans-serif;
    background:var(--bg); color:var(--text); display:flex; flex-direction:column; height:100vh;
  }
  header{
    background:var(--primary); color:#fff; padding:12px 24px;
    display:flex; justify-content:space-between; align-items:center; flex-wrap:wrap; gap:10px;
  }
  header h1{margin:0; font-size:18px; font-weight:700;}
  .toolbar{display:flex; gap:8px; align-items:center; flex-wrap:wrap;}
  .tabs{display:flex; background:#1e293b; border-radius:8px; padding:4px;}
  .tab-btn{
    background:transparent; border:none; color:#94a3b8; padding:7px 14px;
    border-radius:6px; cursor:pointer; font-weight:600; font-size:13px;
  }
  .tab-btn.active{background:#3b82f6; color:#fff;}
  .btn{
    border:none; padding:8px 13px; border-radius:6px; font-size:13px;
    font-weight:600; cursor:pointer; display:inline-flex; align-items:center; gap:6px;
  }
  .btn-word{background:#2563eb; color:#fff;}
  .btn-word:hover{background:#1d4ed8;}
  .btn-pdf{background:#dc2626; color:#fff;}
  .btn-pdf:hover{background:#b91c1c;}
  .btn-save{background:#059669; color:#fff;}
  .btn-save:hover{background:#047857;}
  .btn-reset{background:#64748b; color:#fff;}
  .btn-reset:hover{background:#475569;}

  .main-container{display:flex; flex:1; overflow:hidden;}
  .editor-pane{
    width:44%; min-width:380px; background:var(--panel);
    border-right:1px solid var(--border); padding:20px; overflow-y:auto;
  }
  .editor-section{margin-bottom:18px; padding-bottom:14px; border-bottom:1px solid var(--border);}
  .editor-section h3{
    margin-top:0; font-size:13px; text-transform:uppercase; letter-spacing:.04em;
    color:#1e3a8a; margin-bottom:10px;
  }
  .form-group{margin-bottom:10px;}
  .form-group label{display:block; font-size:12px; font-weight:700; color:#334155; margin-bottom:4px;}
  .form-group input,.form-group textarea,.form-group select{
    width:100%; padding:8px 10px; border:1px solid var(--border);
    border-radius:6px; font-size:13px; font-family:inherit;
  }
  .form-group textarea{resize:vertical; min-height:58px;}
  .fixed-note{
    background:#f8fafc; border:1px dashed #94a3b8; padding:8px 10px;
    border-radius:6px; font-size:12px; color:#475569; margin-top:6px;
  }
  .row-3{display:grid; grid-template-columns:1.2fr 1fr 2fr; gap:8px;}
  .row-2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .clause-item{display:flex; gap:8px; margin-bottom:8px; align-items:flex-start;}
  .clause-item textarea{min-height:46px;}

  .preview-pane{
    flex:1; background:#94a3b8; padding:24px 16px; overflow-y:auto;
    display:flex; flex-direction:column; align-items:center; gap:22px;
  }

  /* ============ EXACT A4 LEGAL SHEET ============ */
  .legal-sheet{
    width:210mm;
    min-height:297mm;
    background:#ffffff;
    padding:15mm 18mm;
    box-shadow:0 10px 25px rgba(0,0,0,.25);
    font-family:"Times New Roman", Times, serif;
    font-size:12pt;
    line-height:1.38;
    color:#000000;
  }
  .legal-sheet p,
  .legal-sheet div,
  .legal-sheet td,
  .legal-sheet span{ font-size:12pt; line-height:1.38; }

  .doc-title{
    text-align:center; font-weight:bold; font-size:14pt; line-height:1.25;
    text-decoration:underline; margin:0 0 10px 0; text-transform:uppercase;
  }
  .doc-center{ text-align:center; font-weight:bold; margin:5px 0; }
  .doc-para{ text-align:justify; margin:0 0 7px 0; }
  .witness-heading{ font-weight:bold; margin:11px 0 5px 0; }

  /* Numbered paragraph — identical hanging indent everywhere */
  .num-para{
    text-align:justify;
    margin:0 0 7px 18pt;
    text-indent:-18pt;
    page-break-inside:avoid;
  }

  /* Increased spacing for signatures */
  .sig-table{ width:100%; border-collapse:collapse; margin-top:6px; }
  .sig-table tr{ height:80px; }
  .sig-table td{ vertical-align:bottom; font-weight:bold; font-size:12pt; }
  td.sig-num{ width:60%; text-align:left; }
  td.sig-label{ width:40%; text-align:right; }

  @media (max-width:900px){
    .main-container{flex-direction:column; overflow:auto;}
    .editor-pane{width:100%; min-width:auto;}
    .preview-pane{padding:12px;}
    .legal-sheet{width:100%; min-height:auto; padding:16px;}
    .sig-table tr{height:60px;}
  }
</style>
</head>
<body>

<header>
  <h1>Agreement Studio</h1>
  <div class="toolbar">
    <div class="tabs">
      <button class="tab-btn active" id="tab-sell" onclick="switchDoc('sell')">Agreement to Sell</button>
      <button class="tab-btn" id="tab-rent" onclick="switchDoc('rent')">Rent Agreement</button>
    </div>
    <button class="btn btn-save" onclick="saveDraft()">Save Draft</button>
    <button class="btn btn-reset" onclick="resetDefault()">Reset Default</button>
    <button class="btn btn-word" onclick="downloadWord()">Download Word (.doc)</button>
    <button class="btn btn-pdf" onclick="downloadPDF()">Download PDF (.pdf)</button>
  </div>
</header>

<div class="main-container">
  <div class="editor-pane" id="form-container"></div>
  <div class="preview-pane" id="preview-pane">
    <div id="legal-document"></div>
  </div>
</div>

<script>
/* ============================================================
   STATE
   ============================================================ */
let currentType = 'sell';

const defaultState = {
  sell: {
    docTitle: "AGREEMENT TO SELL",

    execPlace: "New Delhi",

    firstPartyName: "MR. ANIL NEBHORIA",

    secondPartyRelation: "BOTH SON OF S/O,",

    secondPartyAddress: "RZD-1/30, GALI NO-5, MAHAVIR ENCLAVE, DABRI, SOUTH WEST DELHI,DELHI-110045",

    propertyDetails: "GROUND FLOOR WITHOUT ROOF RIGHTS OF BUILT-UP PROPERTY RZ-B-87, LAND AREA MEASURING 15.049 SQ. MTR. Viz 18 SQ. YDS. OUT OF KHASRA NO. 82/9 SITUATED IN THE REVENUE ESTATE OF VILLAGE PALAM DELHI STATE DELHI AND COLONY KNOWN AS MAHAVIR ENCLAVE, NEW DELHI-110045, along with bike parking",
    
    saleAmount: "5,40,000/- (Rupees Five Lakh Fourty Thousand Only)",

      "That the balance considerations shall be paid by the Second Party to the First Party on or before 30 days or execution and registration of the Sale Deed.",
      "That the parties have mutually agrees to execute and register the Sale Deed before the concerned Sub-Registrar on a consideration amount of Rs. 4,40,000/-",
      "That the First Party assures the second Party that the said property is free from all encumbrances, liens, charges, disputes, litigation, acquisition proceedings, mortgages, and third-party claims.",
      "That the first party shall hand over vacant and peaceful possession of the said property to the Second Party at the time of execution of the sale Deed of as mutually agreed.",
      "That all property taxes, electricity charges, water charges, maintenance charges and other dues up to the date of execution of the Sale Deed shall be borne and paid by the First Party",

      "That both parties shall cooperate and execute all necessary documents required for completion of the sale transaction.",
      "That any dispute arising out of this Agreement shall be subject to the jurisdiction of the courts at New Delhi only."
    ]
  },

  rent: {

    execDate: "01/11/2026",
    execPlace: "DELHI",

    firstPartyName: "MR.VICKEY GOYAL",
    firstPartyRelation: "S/O",
    firstPartyFather: "SITARAM GOYAL",
    firstPartyAddress: "14 BASANT GAON, VASANT VIHAR, PO: SOUTH WEST DELHI, DELHI 110057",

    secondPartyName: "MR RANJEEV HANDA",
    secondPartyRelation: "S/O",
    secondPartyFather: "RAJ KUMAR HANDA",
    secondPartyAddress: "HOUSE NO 22, GREEN CITY COLONY, PHOLRIWAL. PHOLRIWALA JALANDHAR, PUNJAB-144022",

    propertyAddress: "FIRST FLOOR 14 BASANT GAON, VASANT VIHAR, PO: SOUTH WEST DELHI, DELHI 110057",
    letOutPortion: "First FLOOR",

    witnessHeading: "NOW THIS RENT AGREEMENT WITNESSES AS UNDER:",
    page1ClauseCount: 4,
    clauses: [
      "That the rent of the said rented premises shall be pay RS. 12,000/- (RUPEES TWELVE THOUSAND ONLY) per month. Excluding Electricity and water charges per month and shall payable in advance on or before 10th day of each English Calendar month the rent will be increase of 10% after every 11 months.",
      "That the second party has deposited security of RS 35,000/- ( REPEES THIRTY FIVE THOUSAND ONLY)in cash, without interest with the first party which shall be refunded to the second party after the expiry of the tenanted period or at the time of vacating the property by second party after clearing of all the outstanding dues.",

      "That the First Party has handed over the vacant physical possession of rented premises to Second Party on the sport.",
      "THAT the Second Party shall not make any alterations/additions/structural changes in the rented premises without the prior written permission of the First Party.",
      "That the Second Party shall keep the rented premise neat and clean and shall not store any flammable/combustible material in the said premises.",
      "That minor repairs shall be borne and paid by the Second Party and Major repair by the first party",
      "That if any party wants to vacate the said premises before expiry of tenancy period, it shall give one month notice to each party.",
      "That when tenancy period expires the Second Party shall have to vacate the said rented premises immediately and hand over vacant, physical and peaceful possession to the First Party.",
      "That if any dispute arises between the parties hereto the same shall be settled mutually, through Arbitrator or Court of Law",
      "That the present agreement has been executed under the free Will, coercion etc.",
      "If any wrong activity found by second party/ tenant then landlord/first party can get vacated the premises immediately from the second party."
    ]
  }
};

const STORAGE_KEY = 'agreement_studio_draft_v6';

let state = loadState();

/* ============================================================
   HELPERS
   ============================================================ */
function esc(str){
  return String(str == null ? '' : str)
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;');
}

function numPara(num, innerHtml){
  const pad = num < 10 ? '&nbsp;&nbsp;&nbsp;&nbsp;' : '&nbsp;&nbsp;';
  return `<p class="num-para">${num}.${pad}${innerHtml}</p>`;
}

function clampBreak(data){
  const len = data.clauses.length;
  let n = parseInt(data.page1ClauseCount, 10);
  if (isNaN(n) || n < 1) n = 1;
  if (n > len) n = len;
  return n;
}

/* ============================================================
   DOCUMENT BUILDERS
   ============================================================ */
function partyLines(d){
  const sellFP = ", HEREAFTER REFERRED TO AS THE ‘’FIRST PARTY/SELLER’’ (Which expression shall, unless repugnant to the context, include his/her heirs, legal representatives, executors, administrators and assigns).";
  const sellSP = ", HEREAFTER REFERRED TO AS THE ‘’ SECOND PARTY /PURCHASER’’ (Which expression shall, unless repugnant to the context, include his/her heirs, legal representatives, executors, administrators and assigns).";
  const rentSP = ", (herein/ after called the Tenants/ Second Party).";

  if (currentType === 'sell'){
    return {
      p1: `<strong>${esc(d.firstPartyName)}</strong>, ${esc(d.firstPartyRelation)} <strong>${esc(d.firstPartyFather)}</strong>, R/O <strong>${esc(d.firstPartyAddress)}</strong>${sellFP}`,
      p2: `<strong>${esc(d.secondPartyName)}</strong> ${esc(d.secondPartyRelation)} <strong>${esc(d.secondPartyFather)}</strong> R/O <strong>${esc(d.secondPartyAddress)}</strong>${sellSP}`
    };
  }
  return {
    p1: `<strong>${esc(d.firstPartyName)}</strong> ${esc(d.firstPartyRelation)} <strong>${esc(d.firstPartyFather)}</strong> R/O <strong>${esc(d.firstPartyAddress)}</strong>`,
    p2: `<strong>${esc(d.secondPartyName)}</strong> ${esc(d.secondPartyRelation)} <strong>${esc(d.secondPartyFather)}</strong>, R/O <strong>${esc(d.secondPartyAddress)}</strong>${rentSP}`
  };
}

function buildPreamble(d){
  const p = partyLines(d);
  let html = '';
  html += `<div class="doc-title">${esc(d.docTitle)}</div>`;
  
  if (currentType === 'sell') {
    html += `<p class="doc-para">This Agreement to sell is made and executed on this ${esc(d.execDate)} at ${esc(d.execPlace)}.</p>`;
  } else {
    html += `<p class="doc-para">This RENT AGREEMENT is made and executed at ${esc(d.execPlace)} on this ${esc(d.execDate)}</p>`;
  }

  html += `<div class="doc-center">BETWEEN</div>`;
  html += `<p class="doc-para">${p.p1}</p>`;
  html += `<div class="doc-center">AND</div>`;
  html += `<p class="doc-para">${p.p2}</p>`;

  if (currentType === 'sell'){
    html += numPara(1, `The first party is the absolute owner and in possession of the property <strong>${esc(d.propertyDetails)}</strong> (hereafter referred to as the ‘’ said property’’)`);
    html += numPara(2, `The First Party has agreed to sell and the Second Party has agreed to purchase the said property for a total sale consideration of Rs. ${esc(d.saleAmount)}.`);
    html += numPara(3, `Out of the total sale consideration, the Second Party has paid a sum of Rs. ${esc(d.advanceAmount)} though UPI dated 29.09.2026 in cash as carnest money/advance to the First Party, the receipt whereof the First Party hereby acknowledges.`);
    html += numPara(4, `Both parties have mutually agreed that the Sale Deed of the said Property shall be executed and registered before the concerned Sub-Registrar for a consideration amount of Rs. ${esc(d.regAmount)}.`);
    
    if(d.extraRecitals && d.extraRecitals.length > 0) {
      d.extraRecitals.forEach((r, i) => {
        html += numPara(5 + i, esc(r));
      });
    }
    
  } else {
    html += `<p class="doc-para">The expression First Party AND Second Party herein used shall mean and include their respective legal heirs, successors, executors, legal representatives, assigns etc.</p>`;
    html += `<p class="doc-para" style="text-align: left;">WHEREAS the First Party is the owner of <strong>${esc(d.propertyAddress)}</strong><br>(Herein/ after called the <strong>LANDLORD&nbsp; FIRST Party</strong>).</p>`;
    html += `<p class="doc-para">And whereas the second party has approaches the first party to let out <strong>${esc(d.letOutPortion)}</strong> out of the above -mentioned property to the first party have agreed for the same, on the following terms and conditions:-</p>`;
  }

  html += `<div class="witness-heading">${esc(d.witnessHeading)}</div>`;
  return html;
}

function buildClausesRange(d, from, to){
  let html = '';
  for (let i = from; i < to; i++){
    html += numPara(i + 1, esc(d.clauses[i]));
  }
  return html;
}

function buildSignatureBlock(d){
  let title = currentType === 'sell' ? "IN WITNESS WHEREOF" : "IN WITNESS WHERE OF";
  let text = currentType === 'sell' 
    ? "That parties have signed this Agreement to Sell on the date place first mentioned above in the presence of the following witness."
    : "both the parties have extended their respective hands unto this LEASE/ RENT AGREEMENT on the day, month and year first above written in the presence of the following witnesses.";
  let wLabel = currentType === 'sell' ? "WITNESSES" : "WITNESSES:";
  let sign1 = currentType === 'sell' ? "FIRST PARTY /SELLER" : "FIRSTPARTY/LANDLORD";
  let sign2 = currentType === 'sell' ? "SECOND PARTY PURCHASER" : "SECOND PARTY/TENANT";

  return `
    <div class="witness-heading">${title}</div>
    <p class="doc-para">${text}</p>
    <div class="witness-heading">${wLabel}</div>
    <table class="sig-table">
      <tr>
        <td class="sig-num">1.</td>
        <td class="sig-label">${sign1}</td>
      </tr>
      <tr>
        <td class="sig-num">2.</td>
        <td class="sig-label">${sign2}</td>
      </tr>
    </table>`;
}

/* ============================================================
   PREVIEW
   ============================================================ */
function renderDocument(){
  const d = state[currentType];
  const brk = clampBreak(d);

  const page1 = buildPreamble(d) + buildClausesRange(d, 0, brk);
  const page2 = buildClausesRange(d, brk, d.clauses.length) + buildSignatureBlock(d);

  document.getElementById('legal-document').innerHTML =
    `<div class="legal-sheet" id="sheet-1">${page1}</div>
     <div class="legal-sheet" id="sheet-2">${page2}</div>`;
}

/* ============================================================
   FORM
   ============================================================ */
function renderRelationSelect(fieldKey, currentVal){
  const options = ["S/O", "D/O", "W/O", "BOTH SON OF S/O,"];
  return `
    <select onchange="updateField('${fieldKey}', this.value)">
      ${options.map(opt => `<option value="${esc(opt)}" ${currentVal === opt ? 'selected' : ''}>${esc(opt)}</option>`).join('')}
    </select>`;
}

function renderForm(){
  const container = document.getElementById('form-container');
  const data = state[currentType];

  let html = `
    <div class="editor-section">
      <h3>1. Title &amp; Execution Date/Place</h3>
      <div class="form-group"><label>Document Title</label>
        <input type="text" value="${esc(data.docTitle)}" oninput="updateField('docTitle', this.value)"></div>
      <div class="row-2">
        <div class="form-group"><label>Date</label>
          <input type="text" value="${esc(data.execDate)}" oninput="updateField('execDate', this.value)"></div>
        <div class="form-group"><label>Place / Location</label>
          <input type="text" value="${esc(data.execPlace)}" oninput="updateField('execPlace', this.value)"></div>
      </div>
    </div>

    <div class="editor-section">
      <h3>2. First Party (${currentType === 'sell' ? 'Seller' : 'Landlord'})</h3>
      <div class="form-group"><label>Full Name</label>
        <input type="text" value="${esc(data.firstPartyName)}" oninput="updateField('firstPartyName', this.value)"></div>
      <div class="row-3">
        <div class="form-group">
          <label>Relation</label>
          ${renderRelationSelect('firstPartyRelation', data.firstPartyRelation)}
        </div>
        <div class="form-group" style="grid-column:span 2;"><label>Father / Husband Name</label>
          <input type="text" value="${esc(data.firstPartyFather)}" oninput="updateField('firstPartyFather', this.value)"></div>
      </div>
      <div class="form-group"><label>Residential Address</label>
        <textarea oninput="updateField('firstPartyAddress', this.value)">${esc(data.firstPartyAddress)}</textarea></div>
    </div>

    <div class="editor-section">
      <h3>3. Second Party (${currentType === 'sell' ? 'Purchaser' : 'Tenant'})</h3>
      <div class="form-group"><label>Full Name</label>
        <input type="text" value="${esc(data.secondPartyName)}" oninput="updateField('secondPartyName', this.value)"></div>
      <div class="row-3">
        <div class="form-group">
          <label>Relation</label>
          ${renderRelationSelect('secondPartyRelation', data.secondPartyRelation)}
        </div>
        <div class="form-group" style="grid-column:span 2;"><label>Father / Husband Name</label>
          <input type="text" value="${esc(data.secondPartyFather)}" oninput="updateField('secondPartyFather', this.value)"></div>
      </div>
      <div class="form-group"><label>Residential Address</label>
        <textarea oninput="updateField('secondPartyAddress', this.value)">${esc(data.secondPartyAddress)}</textarea></div>
    </div>
  `;

  if (currentType === 'sell'){
    html += `
      <div class="editor-section">
        <h3>4. Property &amp; Payment</h3>
        <div class="form-group"><label>Recital 1 — Property Description (Complete)</label>
          <textarea oninput="updateField('propertyDetails', this.value)">${esc(data.propertyDetails)}</textarea></div>
        
        <div class="form-group"><label>Recital 2 — Total Sale Amount</label>
          <input type="text" value="${esc(data.saleAmount)}" oninput="updateField('saleAmount', this.value)"></div>
        
        <div class="form-group"><label>Recital 3 — Advance/Earnest Amount</label>
          <input type="text" value="${esc(data.advanceAmount)}" oninput="updateField('advanceAmount', this.value)"></div>
        
        <div class="form-group"><label>Recital 4 — Sale Deed Registration Amount</label>
          <input type="text" value="${esc(data.regAmount)}" oninput="updateField('regAmount', this.value)"></div>

        <div class="form-group" style="margin-top:15px; border-top:1px dashed #cbd5e1; padding-top:10px;">
          <label>Additional Recitals</label>
          <div id="extra-recitals-editor"></div>
          <button class="btn" style="background:#475569; color:#fff; margin-top:6px;" onclick="addExtraRecital()">+ Add Recital</button>
        </div>
      </div>`;
  } else {
    html += `
      <div class="editor-section">
        <h3>4. Rented Property Details</h3>
        <div class="form-group"><label>Property Address (Owner Of)</label>
          <textarea oninput="updateField('propertyAddress', this.value)">${esc(data.propertyAddress)}</textarea></div>
        <div class="form-group"><label>Let Out Portion</label>
          <input type="text" value="${esc(data.letOutPortion)}" oninput="updateField('letOutPortion', this.value)"></div>
        <div class="fixed-note">
          <strong>Auto-fixed legal lines:</strong> “The expression First Party AND Second Party herein used shall mean and include …”
          and “(Herein/ after called the LANDLORD FIRST Party).” are attached automatically.
        </div>
      </div>`;
  }

  html += `
    <div class="editor-section">
      <h3>5. Terms &amp; Conditions (Clauses)</h3>
      <div class="form-group">
        <label>Page 1 ends after clause no.</label>
        <input type="number" min="1" max="30" value="${data.page1ClauseCount}"
               oninput="updateField('page1ClauseCount', parseInt(this.value) || 1)">
      </div>
      <div id="clauses-editor"></div>
      <button class="btn" style="background:#475569; color:#fff; margin-top:6px;" onclick="addClause()">+ Add Condition</button>
    </div>
  `;

  container.innerHTML = html;
  renderClauseEditor();
  if (currentType === 'sell') renderExtraRecitals();
}

function renderExtraRecitals(){
  const container = document.getElementById('extra-recitals-editor');
  if(!container) return;
  container.innerHTML = '';
  const recitals = state[currentType].extraRecitals || [];
  recitals.forEach((r, i) => {
    const div = document.createElement('div');
    div.className = 'clause-item';
    div.innerHTML = `
      <span style="font-weight:700; padding-top:8px; font-size:12px; min-width:18px;">${5 + i}.</span>
      <textarea oninput="updateExtraRecital(${i}, this.value)">${esc(r)}</textarea>
      <button class="btn" style="background:#ef4444; color:#fff; padding:8px 10px;" onclick="removeExtraRecital(${i})">×</button>`;
    container.appendChild(div);
  });
}

function renderClauseEditor(){
  const container = document.getElementById('clauses-editor');
  if (!container) return;
  container.innerHTML = '';
  state[currentType].clauses.forEach((clause, index) => {
    const div = document.createElement('div');
    div.className = 'clause-item';
    div.innerHTML = `
      <span style="font-weight:700; padding-top:8px; font-size:12px; min-width:18px;">${index + 1}.</span>
      <textarea oninput="updateClause(${index}, this.value)">${esc(clause)}</textarea>
      <button class="btn" style="background:#ef4444; color:#fff; padding:8px 10px;" onclick="removeClause(${index})">×</button>`;
    container.appendChild(div);
  });
}

/* ============================================================
   ACTIONS
   ============================================================ */
function switchDoc(type){
  currentType = type;
  document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
  document.getElementById(`tab-${type}`).classList.add('active');
  renderForm();
  renderDocument();
}

function updateField(field, value){
  state[currentType][field] = value;
  renderDocument();
}

function updateClause(index, value){
  state[currentType].clauses[index] = value;
  renderDocument();
}

function addClause(){
  state[currentType].clauses.push("That both parties shall abide by all terms and conditions of this agreement.");
  renderClauseEditor();
  renderDocument();
}

function removeClause(index){
  state[currentType].clauses.splice(index, 1);
  renderClauseEditor();
  renderDocument();
}

function updateExtraRecital(index, value){
  state[currentType].extraRecitals[index] = value;
  renderDocument();
}

function addExtraRecital(){
  if(!state[currentType].extraRecitals) state[currentType].extraRecitals = [];
  state[currentType].extraRecitals.push("That both parties mutually agree to the above terms.");
  renderExtraRecitals();
  renderDocument();
}

function removeExtraRecital(index){
  state[currentType].extraRecitals.splice(index, 1);
  renderExtraRecitals();
  renderDocument();
}

function saveDraft(){
  localStorage.setItem(STORAGE_KEY, JSON.stringify(state));
  alert("Draft saved in browser!");
}

function loadState(){
  try{
    const saved = localStorage.getItem(STORAGE_KEY);
    if (saved){
      const parsed = JSON.parse(saved);
      if (parsed && parsed.sell && parsed.rent){
        return parsed;
      }
    }
  }catch(e){ /* ignore */ }
  return JSON.parse(JSON.stringify(defaultState));
}

function resetDefault(){
  if (confirm("Reset all fields to original agreement format?")){
    state = JSON.parse(JSON.stringify(defaultState));
    localStorage.removeItem(STORAGE_KEY);
    renderForm();
    renderDocument();
  }
}

/* ============================================================
   WORD EXPORT
   ============================================================ */
function downloadWord(){
  const d = state[currentType];
  const brk = clampBreak(d);

  const body1 = buildPreamble(d) + buildClausesRange(d, 0, brk);
  const body2 = buildClausesRange(d, brk, d.clauses.length) + buildSignatureBlock(d);

  const wordHTML = `
  <html xmlns:o='urn:schemas-microsoft-com:office:office'
        xmlns:w='urn:schemas-microsoft-com:office:word'
        xmlns='http://www.w3.org/TR/REC-html40'>
  <head>
    <meta charset='utf-8'>
    <title>${esc(d.docTitle)}</title>
    <!--[if gte mso 9]>
    <xml>
      <w:WordDocument>
        <w:View>Print</w:View>
        <w:Zoom>100</w:Zoom>
        <w:DoNotOptimizeForBrowser/>
      </w:WordDocument>
    </xml>
    <![endif]-->
    <style>
      @page WordSection1 {
        size: 210.0mm 297.0mm;
        margin: 15.0mm 18.0mm 15.0mm 18.0mm;
        mso-page-orientation: portrait;
      }
      div.WordSection1 { page: WordSection1; }

      body {
        font-family: "Times New Roman", Times, serif;
        font-size: 12pt;
        line-height: 1.38;
        color: #000000;
        margin: 0;
        padding: 0;
      }
      p { margin: 0; padding: 0; }
      div, span, td { font-family: "Times New Roman", Times, serif; font-size: 12pt; line-height: 1.38; }

      .doc-title {
        text-align: center; font-weight: bold; font-size: 14pt;
        text-decoration: underline; margin: 0 0 10pt 0; text-transform: uppercase;
      }
      .doc-center { text-align: center; font-weight: bold; margin: 5pt 0; }
      .doc-para   { text-align: justify; margin: 0 0 7pt 0; }
      .witness-heading { font-weight: bold; margin: 11pt 0 5pt 0; }

      .num-para {
        text-align: justify;
        margin: 0 0 7pt 18pt;
        text-indent: -18pt;
        mso-hyphenate: none;
      }

      table.sig-table { width: 100%; border-collapse: collapse; margin-top: 6pt; }
      table.sig-table tr { height: 65pt; }
      table.sig-table td {
        vertical-align: bottom; font-weight: bold; font-size: 12pt;
        font-family: "Times New Roman", Times, serif;
      }
      td.sig-num   { width: 60%; text-align: left; }
      td.sig-label { width: 40%; text-align: right; }
    </style>
  </head>
  <body>
    <div class="WordSection1">
      ${body1}
      <br clear="all" style="mso-special-character:line-break;page-break-before:always">
      ${body2}
    </div>
  </body>
  </html>`;

  const blob = new Blob(['\ufeff', wordHTML], { type: 'application/msword' });
  const url = URL.createObjectURL(blob);
  const link = document.createElement("a");
  link.href = url;
  link.download = `${d.docTitle.replace(/\s+/g, '_')}.doc`;
  document.body.appendChild(link);
  link.click();
  document.body.removeChild(link);
  URL.revokeObjectURL(url);
}

/* ============================================================
   PDF EXPORT
   ============================================================ */
function downloadPDF(){
  const d = state[currentType];

  const wrapper = document.createElement('div');
  wrapper.style.position = 'absolute';
  wrapper.style.left = '-10000px';
  wrapper.style.top = '0';
  wrapper.style.background = '#ffffff';
  wrapper.style.width = '210mm';

  const sheets = document.querySelectorAll('#legal-document .legal-sheet');
  sheets.forEach((sheet, idx) => {
    const clone = sheet.cloneNode(true);
    clone.style.width = '100%';
    clone.style.minHeight = '297mm';
    clone.style.margin = '0';
    clone.style.boxShadow = 'none';
    clone.style.boxSizing = 'border-box';
    if (idx > 0) clone.classList.add('pdf-break');
    wrapper.appendChild(clone);
  });

  document.body.appendChild(wrapper);

  const opt = {
    margin: 0,
    filename: `${d.docTitle.replace(/\s+/g, '_')}.pdf`,
    image: { type: 'jpeg', quality: 0.98 },
    html2canvas: { scale: 2, useCORS: true, backgroundColor: '#ffffff' },
    jsPDF: { unit: 'mm', format: 'a4', orientation: 'portrait' },
    pagebreak: { mode: ['css', 'legacy'], before: '.pdf-break' }
  };

  html2pdf().set(opt).from(wrapper).save().then(() => {
    wrapper.remove();
  }).catch(() => {
    wrapper.remove();
  });
}

/* ============================================================
   INIT
   ============================================================ */
(function init(){
  renderForm();
  renderDocument();
})();
</script>
